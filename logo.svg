<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">HUY HOÀNG</title>
  <desc id="logo-desc">Xây dựng tương lai</desc>
  <defs>
    <linearGradient id="brand-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d6ad"/>
      <stop offset="1" stop-color="#149e82"/>
    </linearGradient>
    <linearGradient id="tagline-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a0ead4"/>
      <stop offset="1" stop-color="#62c9ad"/>
    </linearGradient>
  </defs>
  <text x="4" y="83" fill="url(#brand-green)" font-family="Montserrat, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2.5">HUY HOÀNG</text>
  <text x="7" y="140" fill="url(#tagline-green)" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="6.2">XÂY DỰNG TƯƠNG LAI</text>
